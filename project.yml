
name: WatchBridge

options:
  bundleIdPrefix: com.watchbridge
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  WatchBridge:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Models
      - path: Bluetooth
      
      - path: Views

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchbridge.ios
        PRODUCT_NAME: WatchBridge
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "O WatchBridge utiliza Bluetooth para procurar e testar a comunicação com dispositivos smartwatch."
