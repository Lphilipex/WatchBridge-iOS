
name: Ponte

options:
  bundleIdPrefix: com.ponte
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  Ponte:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Models
      - path: Bluetooth
      - path: Services
      - path: Views

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ponte.ios
        PRODUCT_NAME: Ponte
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "O Ponte utiliza Bluetooth para procurar e testar a comunicacao com dispositivos smartwatch."
