

name: Ponte

options:
  bundleIdPrefix: com.ponte
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  Ponte:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Models
      - path: Bluetooth
      - path: Services
      - path: Views

    info:
      path: Ponte-Info.plist
      properties:
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral

        NSBluetoothAlwaysUsageDescription: "O Ponte utiliza Bluetooth para procurar e testar a comunicacao com dispositivos smartwatch."

        NSHealthShareUsageDescription: "O Ponte utiliza dados de saude para integrar as informacoes recebidas do smartwatch com o Apple Saude."

        NSHealthUpdateUsageDescription: "O Ponte precisa salvar dados de frequencia cardiaca e passos no Apple Saude."

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ponte.ios
        PRODUCT_NAME: Ponte
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

        CODE_SIGN_ENTITLEMENTS: Ponte.entitlements
