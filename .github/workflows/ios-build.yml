
name: Ponte iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ponte iOS IPA
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Verificar Xcode
        run: xcodebuild -version

      - name: Verificar e instalar XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project Ponte.xcodeproj \
            -scheme Ponte \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Preparar aplicativo IPA
        run: |
          mkdir -p build/Payload

          cp -R \
            build/Build/Products/Release-iphoneos/Ponte.app \
            build/Payload/Ponte.app

          cd build

          zip -r Ponte.ipa Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-IPA
          path: build/Ponte.ipa
          retention-days: 7
